<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello.</title>
<style>
    /* ============================================================
       TONI SCROLL SIMULATOR
       - Giant rude emoji at the top
       - 100,000 pixels of pure nothing below it
       - A payoff message at the very bottom (she earned it)
       Deploy to GitHub Pages, send her the link, wait.
       ============================================================ */

    html {
        background: #ffffff;
    }

    /* The page itself is 100,000px tall. Empty white nothing. */
    body {
        margin: 0;
        padding: 0;
        height: 100000px;
        background: #ffffff;
    }

    /* The greeting, anchored to the top */
    .salute {
        position: absolute;
        top: 99200px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 14rem;      /* big */
        line-height: 1;
        margin: 0;
        -webkit-user-select: none;
        user-select: none;
    }

    /* Optional tiny caption under the gesture — she'll read it,
       then realise the gesture was only the beginning */
    .caption {
        position: absolute;
        top: 360px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.2rem;
        color: #888888;
    }

    .midpoint{
        position:absolute;
        top: 50000px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.2rem;
        color: #888888;
    }

    .threequarters{
        position:absolute;
        top: 75000px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.2rem;
        color: #888888;
    }

    .onequarter{
        position:absolute;
        top: 25000px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.2rem;
        color: #888888;
    }

    /* The payoff, sitting alone at pixel 99,200 */
    .payoff {
        position: absolute;
        top: 95000px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        color: #333333;
    }

    .payoff h2 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
    }

    .payoff p {
        font-size: 1.1rem;
        color: #777777;
    }
</style>
</head>
<body>

    <!-- The star of the show -->
    

    <div class="caption">Start scrolling.</div>

    <div class="onequarter">Keep scrolling.</div>

    <div class="midpoint"> Keep. Going. </div>

    <div class="threequarters"> Nearly there. </div>

    <!-- She finds this roughly 90 seconds later -->
    <div class="payoff">
        <h2>You scrolled 100,000 pixels for this.</h2>
    </div>

    <div class="salute">🖕</div>

</body>
</html>
